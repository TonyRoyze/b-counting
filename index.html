<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="B-Counting, an accessible command-driven accounting application."
    />
    <title>B-Counting</title>
  </head>
  <body>
    <main class="desktop">
      <section class="terminal" aria-labelledby="terminal-title">
        <h1 class="visually-hidden" id="terminal-title">B-Counting command prompt</h1>

        <header class="terminal-bar" aria-hidden="true">
          <span class="window-controls">
            <span class="window-control window-control--close"></span>
            <span class="window-control window-control--minimize"></span>
            <span class="window-control window-control--maximize"></span>
          </span>
          <span class="folder-icon"></span>
          <span class="terminal-location">~</span>
        </header>

        <div class="terminal-body">
          <div class="terminal-output" id="terminal-output" role="log" aria-label="Command history"></div>

          <form class="command-form" id="command-form">
            <label class="visually-hidden" for="command-input">Command</label>
            <p class="visually-hidden" id="command-help">
              B-Counting ready. Type help for available commands and press Enter.
            </p>
            <div class="command-line">
              <span class="prompt-path" aria-hidden="true">~</span>
              <span class="prompt-symbol" aria-hidden="true">❯</span>
              <input
                id="command-input"
                name="command"
                type="text"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                aria-describedby="command-help"
                autofocus
              />
            </div>
          </form>

          <div class="visually-hidden" id="announcer" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
