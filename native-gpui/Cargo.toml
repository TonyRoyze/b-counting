[package]
name = "b-counting-gpui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A standalone native B Counting workspace, built with Rust and GPUI"

[dependencies]
gpui = { version = "=0.2.2", features = ["runtime_shaders"] }
unicode-segmentation = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
tempfile = "3"
fs2 = "0.4"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
gpui = { version = "=0.2.2", features = ["test-support", "runtime_shaders"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
